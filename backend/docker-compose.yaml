services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      SIDPB_SUBMISSIONS_STORAGE_DIR: /app/storage/submissions
    volumes:
      - submissions_data:/app/storage
    depends_on:
      db:
        condition: service_healthy
  
  db:
    image: postgis/postgis:15-3.4-alpine
    container_name: sidpb_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./seed_miiase_test.sql:/docker-entrypoint-initdb.d/01-seed-miiase.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB} -h localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
  
  base_geografica:
    build:
      context: ./${BASE_GEOGRAFICA_PATH}
      dockerfile: Dockerfile
    profiles:
      - base_geografica
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB}
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      SHAPE_ENCODING: UTF-8
      REGIOES_SHP: ${REGIOES_SHP}
      ESTADOS_SHP: ${ESTADOS_SHP}
      MUNICIPIOS_SHP: ${MUNICIPIOS_SHP}
      TRANSFORMACAO_STG_TO_DB: ${TRANSFORMACAO_STG_TO_DB}
    volumes:
      - ./${BASE_GEOGRAFICA_PATH}:/base_geografica
    entrypoint: ["/bin/bash", "/base_geografica/scripts/load-ibge.sh"]
    restart: "no"
volumes:
  db_data:
  submissions_data:
  base_geografica:
