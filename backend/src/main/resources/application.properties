spring.application.name=sidpb-backend
sidpb.auth.reconciliation-enabled=${ACCOUNT_RECONCILIATION_ENABLED:true}
# Host execution from backend/; Compose provides explicit environment variables.
spring.config.import=optional:file:../.env[.properties]
sidpb.cors.origin=${AUTH_ORIGIN}
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:sidpb_db}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}

# Hibernate is disabled because Flyway will manage schema
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.type.json_format_mapper=jackson

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.default-schema=public
spring.flyway.schemas=public

sidpb.auth.issuer=${KEYCLOAK_ISSUER:${KEYCLOAK_PUBLIC_URL}/realms/sidpb}
sidpb.auth.internal-url=${KEYCLOAK_INTERNAL_URL:${KEYCLOAK_PUBLIC_URL}}
sidpb.auth.jwks=${sidpb.auth.internal-url}/realms/sidpb/protocol/openid-connect/certs
sidpb.auth.audience=sidpb-api
sidpb.auth.api-secret=${KEYCLOAK_API_SECRET:}
sidpb.auth.service-secret=${KEYCLOAK_SERVICE_SECRET:}

# PDFs no filesystem; referência relativa no banco. Docker usa volume persistente.
sidpb.storage.submissions-dir=${SIDPB_SUBMISSIONS_STORAGE_DIR:./storage/submissions}
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=25MB

# HTTP client debug logs include form bodies containing service secrets and tokens.
logging.level.org.springframework.web.client=WARN
logging.level.org.springframework.web.HttpLogging=WARN

# Extração: "mock" (fixture local, padrão de desenvolvimento) ou "pipeline" (worker externo pega na fila /api/pipeline).
sidpb.extraction.mode=${SIDPB_EXTRACTION_MODE:mock}
